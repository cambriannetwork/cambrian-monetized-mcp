# Cloud Build configuration for GCP
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cambrian-mcp-server:$COMMIT_SHA', '.']
  
  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cambrian-mcp-server:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cambrian-mcp-server'
      - '--image=gcr.io/$PROJECT_ID/cambrian-mcp-server:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=100'
      - '--timeout=300'
      - '--set-env-vars=NODE_ENV=production'

# Store image in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/cambrian-mcp-server:$COMMIT_SHA'

# Set timeout for build
timeout: '1200s'

# Substitutions (can be overridden)
substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY